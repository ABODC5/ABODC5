<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="ABODC5 developer portfolio animated banner">
 <defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d1b"/><stop offset="0.5" stop-color="#11172b"/><stop offset="1" stop-color="#080d1b"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#46d8ff"/><stop offset="0.52" stop-color="#8c7bff"/><stop offset="1" stop-color="#46d8ff"/></linearGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#7c8aaf" stroke-opacity=".10" stroke-width="1"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="11"/></filter>
  <clipPath id="clip"><rect width="1200" height="340" rx="24"/></clipPath>
 </defs>
 <g clip-path="url(#clip)">
  <rect width="1200" height="340" fill="url(#bg)"/><rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="980" cy="150" r="160" fill="#6751de" opacity=".17" filter="url(#glow)"><animate attributeName="r" values="135;185;135" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="170" cy="260" r="125" fill="#19b6e6" opacity=".12" filter="url(#glow)"><animate attributeName="r" values="125;155;125" dur="6s" repeatCount="indefinite"/></circle>
  <path d="M65 55h30 M65 55v30 M1135 55h-30 M1135 55v30 M65 285h30 M65 285v-30 M1135 285h-30 M1135 285v-30" fill="none" stroke="#5bbed9" stroke-opacity=".6" stroke-width="2"/>
  <g opacity=".8" font-family="monospace" font-size="13" fill="#80a6cc"><text x="82" y="94">&lt;PROFILE /&gt;</text><text x="1025" y="94">v1.0.0</text></g>
  <text x="600" y="164" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" letter-spacing="9" fill="url(#accent)">ABODC5</text>
  <rect x="386" y="190" width="428" height="2" rx="1" fill="url(#accent)" opacity=".7"/>
  <text x="600" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3" fill="#dce9ff">BUILDING THINGS THAT WORK</text>
  <text x="600" y="276" text-anchor="middle" font-family="monospace" font-size="14" letter-spacing="1.5" fill="#98b2d2">WEB DEVELOPMENT  ·  DASHBOARDS  ·  INFRASTRUCTURE</text>
  <rect x="0" y="331" width="280" height="4" fill="url(#accent)" opacity=".9"><animate attributeName="x" values="-280;1200" dur="5s" repeatCount="indefinite"/></rect>
  <g fill="#60dfff"><circle cx="222" cy="82" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="1010" cy="260" r="3"><animate attributeName="opacity" values="1;.15;1" dur="4s" repeatCount="indefinite"/></circle></g>
 </g>
</svg>
